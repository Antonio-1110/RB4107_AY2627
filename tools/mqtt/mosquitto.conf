# RB4107 development broker (Mosquitto 2.x) for the MacBook.
#
# Start it with:   ./start_broker.sh
#
# SECURITY: anonymous access on the LAN is fine for a bench prototype on a
# trusted network. Before the system goes anywhere else, add
# password_file / TLS.

# Listen on every interface so the ESP32-S3 can connect over the LAN.
# (Mosquitto 2.x only listens on localhost unless a listener is configured.)
listener 1883 0.0.0.0
allow_anonymous true

# Keep retained messages (e.g. rb4107/controller/status) across broker restarts.
persistence true
persistence_location /tmp/rb4107_mosquitto/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
